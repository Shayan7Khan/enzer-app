name: enzer_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1+7

environment:
  sdk: ^3.9.2

# Dependencies
dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  flutter_advanced_drawer: ^1.3.0
  flutter_rating_bar: ^4.0.0
  flutter_screenutil: ^5.9.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.2.3
  shimmer: ^3.0.0

  # State Management & Utilities
  get: ^4.6.5
  get_it: ^8.2.0
  provider: ^6.1.5
  logger: ^2.6.1
  intl: ^0.20.2
  modal_progress_hud_nsn: ^0.5.1
  shared_preferences: ^2.1.1
  url_launcher: ^6.1.12

  # Device & Connectivity
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.1.0
  device_preview: ^1.3.1
  permission_handler: ^12.0.1

  # Maps & Location
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.3.0

  # Files & Images
  dio: ^5.9.0
  file_picker: ^10.3.3
  image_picker: ^1.2.0
  image: ^4.1.6
  rename: ^3.1.0
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.12.0
  chottu_link: ^1.0.19
  google_fonts: ^8.0.1
  path: ^1.9.1
  flutter_otp_text_field: ^1.5.1+1
  share_plus: ^12.0.1
  timelines_plus: ^1.0.0
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^20.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_ios_icon.png"
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_text.png"
  image_path_ios: "assets/images/app_ios_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  #assets
  assets:
    - .env
    - assets/images/
    - assets/fonts/

  #fonts
  fonts:
    - family: Futura
      fonts:
        - asset: assets/fonts/Futura Bold/Futura Bold.otf
          weight: 700
